# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: seeeduino_xiao_rp2040
    shield: zilpzalp
  - board: nice_nano_v2
    shield: swweeep_left
    cmake-args: -DKEYMAP_FILE=${GITHUB_WORKSPACE}/config/swweeep_colemak.keymap
    artifact-name: swweeep_left-colemak-dh
  - board: nice_nano_v2
    shield: swweeep_left
    cmake-args: -DKEYMAP_FILE=${GITHUB_WORKSPACE}/config/swweeep_aptmak.keymap
    artifact-name: swweeep_left-aptmak
  - board: nice_nano_v2
    shield: swweeep_right
    # the right half doesn't use the keymap, but the build still needs one
    cmake-args: -DKEYMAP_FILE=${GITHUB_WORKSPACE}/config/swweeep_colemak.keymap
  - board: bw2
    shield: bw2_cirque
    cmake-args: -DKEYMAP_FILE=${GITHUB_WORKSPACE}/config/bw2_colemak.keymap
    artifact-name: bw2-colemak-dh
  - board: bw2
    shield: bw2_cirque
    cmake-args: -DKEYMAP_FILE=${GITHUB_WORKSPACE}/config/bw2_aptmak.keymap
    artifact-name: bw2-aptmak
